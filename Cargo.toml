[package]
name = "btc-collider-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bech32 = "0.12"
bs58 = "0.5"
chrono = "0.4"
clap = { version = "4.3", features = ["derive"] }
flate2 = "1.0"
hex-literal = "1.0"
log = "0.4"
num-bigint = { version = "0.5", features = ["rand_0_10"] }
num-traits = "0.2"
num_cpus = "1.16"
primitive-types = "0.14"
rand = "0.10"
ripemd = "0.2"
secp256k1 = "0.33"
sha2 = "0.11"
simplelog = "0.12"

[dev-dependencies]
parameterized-macro = "3.0"
criterion = "0.8"

[[bench]]
name = "collider"
harness = false
